apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agriculture-app
  labels:
    app: smart-agriculture
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-agriculture
  template:
    metadata:
      labels:
        app: smart-agriculture
    spec:
      containers:
      - name: spark-app
        image: smart-agriculture:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: SPARK_MODE
          value: "master"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: agriculture-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agriculture-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
